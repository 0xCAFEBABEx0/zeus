# CodeRabbit configuration for Zeus.
# Reference: https://docs.coderabbit.ai/reference/configuration
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reads this file from the pull request's head branch, so a change here takes effect
# on the next pull request that contains it. See docs/DEVELOPMENT_WORKFLOW.md#code-review.

language: en-US
tone_instructions: >-
  Be concise and specific. Explain why a finding matters for this Payload CMS + Astro site and
  suggest a concrete fix. Skip praise and restating the diff.

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    # `main` is the default branch and is always reviewed (preview → main releases, hotfix/* PRs).
    # `development` receives the Dependabot pull requests (.github/dependabot.yml).
    # `preview` and `development` otherwise take direct pushes, so no other branch needs a review.
    base_branches:
      - '^development$'

  path_filters:
    # Generated by Payload: regenerate instead of editing (bun run generate:types / generate:importmap)
    - '!packages/core/src/payload-types.ts'
    - '!apps/cms/src/app/(payload)/admin/**'
    - '!apps/cms/src/app/(payload)/layout.tsx'
    # Migration schema snapshots written by `payload migrate:create`; the .ts migrations are reviewed
    - '!packages/core/src/migrations/*.json'
    # Not used by the application (see docs/KNOWN_ISSUES.md U2)
    - '!prisma/**'

  path_instructions:
    - path: '**/*'
      instructions: |
        Repository context:
        - Bun workspace. `apps/cms` (@zeus/cms) is a thin Next.js shell around Payload CMS, deployed to cms.ausor.ai.
          `apps/web` (@zeus/web) is the public Astro website (output: 'server', Vercel ISR), deployed to ausor.ai; it reads
          the CMS REST API and imports only types and a few helpers from `@zeus/core`. `packages/core` (@zeus/core) holds
          the Payload config, collections, blocks, hooks, access functions, migrations and generated types.
        - The documentation in `docs/` describes the code on `main`. When a change alters behaviour, configuration,
          endpoints or the data model, the same pull request must update the matching document (DESIGN, DATA_MODEL,
          API, CONFIGURATION, DEPLOYMENT, KNOWN_ISSUES). Flag missing documentation updates.
        - `.cursor/rules/` and `.cursorrules/` are outdated (they mention Prisma, a Next.js frontend and feature branches
          from main). Follow `AGENTS.md` and `docs/` instead and do not raise findings based on those Cursor rules.
        - Commit messages, pull request text, code comments and docs are written in English; flag Japanese or other
          non-English text in those places.

    - path: 'packages/core/src/collections/**'
      instructions: |
        - Every write operation must use the `authenticated` access function; reads use `authenticatedOrPublished`
          for drafts-enabled collections (pages, posts) and `anyone` only for public data. Flag any access change that
          exposes drafts or the `users` collection.
        - A field, block or collection change requires regenerated types (`bun run generate:types`; CI fails on a
          type mismatch) and a new migration in `packages/core/src/migrations/`. Flag schema changes without a migration.
        - Content shown on the website must be revalidated: `afterChange`/`afterDelete` hooks call
          `revalidateFrontend()` with the affected paths and tags, and respect `context.disableRevalidate`.
          A new tag must also be mapped to paths in `apps/web/src/pages/api/revalidate.ts`.
        - Posts expose authors only through `populatedAuthors` (id, name); never leak user e-mail or other user fields.

    - path: 'packages/core/src/{Header,Footer,blocks,heros,fields,search,plugins}/**'
      instructions: |
        - Schema changes need regenerated types and a migration (see the collections instructions).
        - A new or changed block or hero needs a matching renderer in `apps/web/src/components/blocks/` or
          `apps/web/src/components/heros/` (and `RenderBlocks.astro`), and a `depth` in `apps/web/src/lib/cms.ts`
          that populates its relations. Rich-text blocks need an HTML converter in `apps/web/src/lib/richtext.ts`.
        - Global changes must keep their revalidation hooks (`global_header`, `global_footer` tags).

    - path: 'packages/core/src/access/**'
      instructions: |
        Security-critical. Check that unauthenticated requests can never write, and that `authenticatedOrPublished`
        still restricts anonymous reads to `_status: published`. Any loosening of access needs a clear justification
        in the pull request.

    - path: 'packages/core/src/migrations/**/*.ts'
      instructions: |
        - `up` and `down` must be symmetric, and `index.ts` must register the migration in order.
        - Production builds do not run `payload migrate`; the SQL is applied to the production database by hand, and the
          historical snapshots did not always match production (docs/KNOWN_ISSUES.md U11). Flag destructive statements
          (DROP, type changes, NOT NULL without default) and make sure the pull request describes the manual database
          step.
        - Use `@payloadcms/db-postgres` imports; `@payloadcms/db-vercel-postgres` is only kept for the two oldest
          migrations.

    - path: 'packages/core/src/{hooks,utilities,endpoints}/**'
      instructions: |
        - `revalidateFrontend()` must never throw into a Payload write: it logs failures, times out after 10 seconds and
          skips when `REVALIDATION_SECRET` is unset. Keep that behaviour.
        - The seed endpoint and seed data run with `context.disableRevalidate`; do not make seeding reachable without
          authentication.
        - Environment variables read by CMS code must be declared in `packages/core/src/environment.d.ts`.

    - path: 'packages/core/src/payload.config.ts'
      instructions: |
        Check CORS (only the website and CMS origins), database TLS settings, the jobs endpoint access
        (signed-in users or `Authorization: Bearer CRON_SECRET`) and that new plugins or collections are wired consistently.

    - path: 'apps/cms/**'
      instructions: |
        - The CMS app is a thin Next.js shell; Payload configuration and business logic belong in `packages/core`.
        - Route handlers under `src/app/(payload)/` must authenticate anything that changes data. `/api/sentry-test` must
          stay disabled (404) in production.
        - Variables that a production build cannot work without belong in `requiredEnv` in `next.config.mjs`.

    - path: 'apps/web/src/pages/api/**'
      instructions: |
        Security-critical. `/api/revalidate` must reject requests without `Authorization: Bearer REVALIDATION_SECRET`
        before doing any work, accept only relative paths that start with `/`, keep the concurrency limit and never
        echo secrets or the ISR bypass token in responses or logs.

    - path: 'apps/web/src/pages/next/**'
      instructions: |
        Draft preview: `/next/preview` must check `PREVIEW_SECRET`, accept only relative paths, verify the editor's
        `payload-token` against the CMS (`/api/users/me`) before setting the `__prerender_bypass` cookie, and clear draft
        mode on failure. Flag open redirects (protocol-relative `//host` paths included) and a draft cookie without
        `HttpOnly` and `Secure` (`SameSite=None` is intended so that live preview works inside the admin iframe).

    - path: 'apps/web/src/**/*.{astro,ts,mjs}'
      instructions: |
        - Pages are server-rendered and cached by Vercel ISR, which ignores the query string. A route that depends on
          the query string or cookies must not be cached (see `isr.exclude` in `astro.config.mjs`), and draft content
          must never end up in a cached response (draft mode sends `Cache-Control: private, no-store`).
        - Read runtime environment variables with `env()` from `src/lib/env.ts`: on Vercel they exist only on
          `process.env`, so `import.meta.env` alone is not enough (build-time flags such as `import.meta.env.DEV` are fine).
        - All CMS requests go through `src/lib/cms.ts` with an explicit `depth` and `limit`. Components that call the CMS
          must handle errors the way Header/Footer do, so that a CMS outage does not break the whole page.
        - `set:html` is only acceptable for HTML produced by `src/lib/richtext.ts`; flag any other use with CMS or user
          content (XSS).
        - Ship no client-side JavaScript unless it is needed; prefer plain HTML, Tailwind CSS 4 and daisyUI 5 classes.
          Check accessibility: alt text on images, labels on form fields, semantic headings and links.

    - path: 'apps/web/src/middleware.ts'
      instructions: |
        Runs on every request. Keep it cheap: redirects are cached per instance for 60 seconds. Check that `/admin*`
        still goes to the CMS and that redirects cannot be turned into open redirects to arbitrary hosts unless the
        Redirects collection explicitly stores an external URL.

    - path: '.github/workflows/**'
      instructions: |
        - Install with `bun install --frozen-lockfile` and keep the Node.js and Bun versions in line with `.nvmrc`,
          `package.json` (`engines`, `packageManager`) and the `Dockerfile`.
        - Use least-privilege `permissions`, do not print secrets, and avoid `pull_request_target` with untrusted code.
        - `deploy.yml` and `deployment.yml` are known duplicates (docs/KNOWN_ISSUES.md U1); edits must keep them in sync
          until one is removed.

    - path: '{.env.example,packages/core/src/environment.d.ts,apps/cms/next.config.mjs,apps/web/astro.config.mjs}'
      instructions: |
        A new environment variable must appear in `.env.example` (with a comment), in `docs/CONFIGURATION.md`, in
        `environment.d.ts` when CMS code reads it, and the pull request must say which Vercel project(s) need it.

    - path: 'docs/**'
      instructions: |
        Check that the text matches the code, links to files and anchors resolve, and tables stay consistent. Remove a
        `KNOWN_ISSUES.md` entry only when the pull request actually fixes it. Prefer links to source files over long code
        snippets.

  pre_merge_checks:
    docstrings:
      # The code base documents behaviour in docs/ and short comments, not docstrings on every function
      mode: 'off'
    title:
      mode: warning
      requirements: >-
        Written in English, concise and descriptive. A preview → main pull request summarises the release; other
        pull requests use a Conventional Commits prefix (feat, fix, docs, chore, ci, refactor, perf, test).
    description:
      mode: warning
    custom_checks:
      - name: Production release notes
        mode: warning
        instructions: |
          Applies only when the base branch is `main`; otherwise pass.
          Pass if the pull request description summarises what is released and, for each of the following that the
          diff contains, names the manual step: a new or changed file in `packages/core/src/migrations/` (database
          change to apply), a new environment variable (which Vercel project needs it), or a change to `vercel.json`,
          `astro.config.mjs` or `next.config.mjs` that needs Vercel settings. Fail if such a change is present and the
          description does not mention its manual step.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - docs/DESIGN.md
      - docs/DEVELOPMENT_WORKFLOW.md
